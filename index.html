<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#101014" />
    <meta name="description" content="An interactive 3D study of a chromatic balloon dog." />
    <title>Chromatic Balloon Dog</title>
    <script>
      try {
        const savedTheme = localStorage.getItem('balloon-animal-studio-theme')
        if (savedTheme === 'light' || savedTheme === 'dark') document.documentElement.dataset.theme = savedTheme
      } catch (_) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
